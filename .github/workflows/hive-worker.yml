name: HIVE CPU-00 Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hive-worker.yml'
      - 'worker/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: envelope
        type: choice
        options:
          - envelope
          - direct
          - claim
      hive_task_id:
        description: HIVE task UUID for envelope mode
        required: false
        default: ''
        type: string
      envelope_b64:
        description: URL-safe base64 HIVE Job Envelope v1 for stateless execution
        required: false
        default: ''
        type: string
      task_type:
        description: Allow-listed direct task type
        required: true
        default: selftest
        type: choice
        options:
          - selftest
          - sha256-burn
      job_id:
        description: Direct-mode job identifier
        required: true
        default: manual-canary
        type: string
      payload_json:
        description: Direct-mode JSON object payload
        required: true
        default: '{"rounds":250000}'
        type: string
      shard:
        description: Direct-mode logical shard number
        required: true
        default: 0
        type: number

permissions:
  contents: read
  id-token: write

jobs:
  canary:
    name: CPU-00 canary shard ${{ matrix.shard }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      HIVE_WORKER_ENDPOINT: https://hive-alveare.pages.dev/api/compute-worker
      CF_ACCESS_CLIENT_ID: ${{ secrets.HIVE_CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.HIVE_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove short-lived GitHub OIDC identity
        env:
          OIDC_OUTPUT: artifacts/oidc-claims-${{ matrix.shard }}.json
        run: python worker/oidc_claims.py

      - name: Probe HIVE edge identity when Access is configured
        run: >-
          python worker/hive_client.py identity
          --optional
          --output "artifacts/hive-identity-${{ matrix.shard }}.json"

      - name: Execute deterministic canary workload
        run: >-
          python worker/hive_worker.py
          --task-type selftest
          --job-id "cpu00-canary-${GITHUB_RUN_ID}"
          --payload-json '{"rounds":250000}'
          --shard "${{ matrix.shard }}"
          --output "artifacts/result-${{ matrix.shard }}.json"

      - name: Validate stateless Job Envelope execution
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          ENVELOPE_B64="$(python - <<'PY'
          import base64, json, os
          envelope={
            'schema_version':'1.0',
            'job_id':f"stateless-canary-{os.environ['GITHUB_RUN_ID']}-{os.environ['SHARD']}",
            'project_slug':'hive',
            'priority':50,
            'workload':{'name':'selftest','version':'1'},
            'requirements':{'class':'cpu','required_capabilities':['cpu','github-actions']},
            'source':{'repository':'giovannifidel-collab/hive-compute-node-00','commit_or_version':os.environ['GITHUB_SHA']},
            'inputs':[],
            'parameters':{'rounds':50000},
            'evidence_required':True,
            'metadata':{'shard':int(os.environ['SHARD'])}
          }
          raw=json.dumps(envelope,separators=(',',':')).encode()
          print(base64.urlsafe_b64encode(raw).decode().rstrip('='))
          PY
          )"
          python worker/run_job_envelope.py \
            --envelope-b64 "$ENVELOPE_B64" \
            --hive-task-id "canary-${GITHUB_RUN_ID}-${SHARD}" \
            --output "artifacts/stateless-result-${SHARD}.json"

      - name: Validate result envelopes
        env:
          RESULT_PATH: artifacts/result-${{ matrix.shard }}.json
          STATELESS_RESULT_PATH: artifacts/stateless-result-${{ matrix.shard }}.json
        run: |
          python - <<'PY'
          import json, os
          direct=json.load(open(os.environ['RESULT_PATH']))
          assert direct['schema_version']=='1.0'
          assert direct['node_id']=='hive-compute-node-00'
          assert direct['provider']=='github-actions'
          assert direct['status']=='done'
          assert direct['provenance']['repository']=='giovannifidel-collab/hive-compute-node-00'
          assert direct['result_sha256']
          stateless=json.load(open(os.environ['STATELESS_RESULT_PATH']))
          assert stateless['status']=='done'
          assert stateless['dispatch_mode']=='stateless-artifact'
          assert stateless['project_slug']=='hive'
          assert stateless['hive_task_id']
          assert stateless['job_envelope']['workload']['name']=='selftest'
          print('direct result valid:', direct['result_sha256'])
          print('stateless envelope result valid:', stateless['job_id'])
          PY

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-cpu00-canary-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  dispatch:
    name: HIVE dispatched CPU task
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HIVE_WORKER_ENDPOINT: https://hive-alveare.pages.dev/api/compute-worker
      CF_ACCESS_CLIENT_ID: ${{ secrets.HIVE_CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.HIVE_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove short-lived GitHub OIDC identity
        env:
          OIDC_OUTPUT: artifacts/oidc-claims.json
        run: python worker/oidc_claims.py

      - name: Execute stateless HIVE Job Envelope
        if: inputs.mode == 'envelope'
        env:
          HIVE_TASK_ID: ${{ inputs.hive_task_id }}
          ENVELOPE_B64: ${{ inputs.envelope_b64 }}
        run: |
          test -n "$ENVELOPE_B64" || { echo 'envelope_b64 is required for envelope mode' >&2; exit 2; }
          python worker/run_job_envelope.py \
            --envelope-b64 "$ENVELOPE_B64" \
            --hive-task-id "$HIVE_TASK_ID" \
            --output artifacts/result.json

      - name: Claim and execute one HIVE task
        if: inputs.mode == 'claim'
        run: python worker/run_hive_claim.py --lease-seconds 600 --artifact-dir artifacts

      - name: Probe HIVE identity for direct mode
        if: inputs.mode == 'direct'
        run: python worker/hive_client.py identity --optional --output artifacts/hive-identity.json

      - name: Execute allow-listed direct task
        if: inputs.mode == 'direct'
        env:
          TASK_TYPE: ${{ inputs.task_type }}
          JOB_ID: ${{ inputs.job_id }}
          PAYLOAD_JSON: ${{ inputs.payload_json }}
          SHARD: ${{ inputs.shard }}
        run: >-
          python worker/hive_worker.py
          --task-type "${TASK_TYPE}"
          --job-id "${JOB_ID}"
          --payload-json "${PAYLOAD_JSON}"
          --shard "${SHARD}"
          --output artifacts/result.json

      - name: Upload task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-cpu00-result-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
